<html>
<head>
<title>Edit Entry</title>
<link rel="stylesheet" type="text/css" href="/phonebook/style.css">
<body>
<div class="panel_content">
<form method="POST" action="/phonebook/entries/{{ address.id }}" enctype="application/x-www-form-urlencoded"
class="form">
<label class="form_label">Given name</label>
<input class="form_input" name="given_name" value="{{ address.given_name }}">
<label class="form_label">Family name</label>
<input class="form_input" name="family_name" value="{{ address.family_name }}"></label>
<label class="form_label">Phone_Number</label>
<input class="form_input" name="phone_number" value="{{ address.phone_number }}"></label>
<label class="form_label">E-Mail address</label>
<input class="form_input" name="e_mail_address" value="{{
address.e_mail_address }}"></label>
<p><button>Submit</button>
<p>{{ message }}
</form>
</div>
